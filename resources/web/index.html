<!DOCTYPE html>
<html>

<head>
    <!--
      If you are serving your web app in a path other than the root, change the
      href value below to reflect the base path you are serving from.

      The path provided below has to start and end with a slash "/" in order for
      it to work correctly.

      For more details:
      * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

      This is a placeholder for base href that will be replaced by the value of
      the `--base-href` argument provided to `flutter build`.
    -->
    <base href="/webclient/">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Remote Desktop.">

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="RustDesk">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

    <title>RustDesk Admin · Cliente web</title>
    <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
    <link rel="stylesheet" href="theme-admin.css">
    <script>
      (function () {
        if (window.firebase && window.firebase.SDK_VERSION) return;
        var apps = {};
        function App(opts, name) {
          this.options = opts || {};
          this.name = name || '[DEFAULT]';
          this.automaticDataCollectionEnabled = false;
        }
        window.firebase = {
          SDK_VERSION: '8.10.1',
          initializeApp: function (options, name) {
            name = name || '[DEFAULT]';
            apps[name] = new App(options, name);
            return apps[name];
          },
          app: function (name) {
            name = name || '[DEFAULT]';
            if (!apps[name]) {
              var err = new Error("Firebase: No Firebase App '" + name + "'");
              err.code = 'app/no-app';
              throw err;
            }
            return apps[name];
          },
          analytics: function () {
            return { logEvent: function () {}, setCurrentScreen: function () {}, setUserId: function () {}, setUserProperties: function () {} };
          }
        };
      })();
    </script>
    <script src="/webclient-config/index.js"></script>
    <script>
      (function () {
        var host = 'rustdesk.campano.cl:21116';
        var cur = localStorage.getItem('custom-rendezvous-server') || '';
        if (!cur || /127\.0\.0\.1|localhost/.test(cur)) {
          localStorage.setItem('custom-rendezvous-server', host);
          localStorage.setItem('wc-custom-rendezvous-server', host);
        }
        if (!localStorage.getItem('key')) {
          localStorage.setItem('key', 'Pj7hMnB0tm5g7qnTz689wIqkXG0vMzF+S1+rqQ4w5Tk=');
        }
      })();
    </script>
    <script src="ogvjs-1.8.6/ogv.js"></script>
    <script type="module" crossorigin src="js/dist/index.js"></script>
    <script src="js/kbd-fix.js"></script>
    <script>
    </script>
    <link rel="modulepreload" href="js/dist/vendor.js">
    <script src="yuv-canvas-1.2.6.js"></script>

</head>

<body>
<header class="rd-wc-header">
  <a class="rd-wc-brand" href="/_admin/#/home">
    <span class="rd-wc-mark">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="12" rx="2.5"></rect>
        <path d="M8 20h8"></path>
        <path d="M12 16v4"></path>
      </svg>
    </span>
    <span>
      <span class="name">RustDesk Admin</span>
      <span class="sub">Cliente web</span>
    </span>
  </a>
  <span class="rd-wc-actions">
    <a class="rd-wc-back" href="/_admin/#/home">Volver al panel</a>
    <button type="button" class="rd-wc-logout" id="rd-wc-logout">Cerrar sesión</button>
  </span>
</header>
<div class="loading">
    <div class="loader"></div>
    <div>Cargando cliente web…</div>
</div>
<!-- This script installs service_worker.js to provide PWA functionality to
     application. For more information, see:
     https://developers.google.com/web/fundamentals/primers/service-workers -->
<script>
    var scriptLoaded = false;

    function loadMainDartJs() {
        if (scriptLoaded) {
            return;
        }
        scriptLoaded = true;
        var scriptTag = document.createElement('script');
        scriptTag.src = 'main.dart.js';
        scriptTag.type = 'application/javascript';
        document.body.append(scriptTag);
    }

    function startDart() {
        loadMainDartJs();
    }

    if (navigator.serviceWorker) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }).catch(function () {}).finally(startDart);
    } else {
        startDart();
    }

    (function hideLoaderWhenReady() {
      var n = 0;
      var t = setInterval(function () {
        var ready = document.querySelector('flt-glass-pane') || document.querySelector('flutter-view');
        if (ready || ++n > 80) {
          var el = document.querySelector('.loading');
          if (el) el.style.display = 'none';
          clearInterval(t);
        }
      }, 250);
    })();
</script>
</body>

</html>
